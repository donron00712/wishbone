<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source for og.png. The card shows the slip, because the slip is what is
       sold — the site no longer names a food anywhere, and the artwork should
       not either. The two papers mirror the fortune and ad papers the wall and
       the unit render, so a shared link previews the same object the site does.
       (Their class names are written out of this comment on purpose: a double
       hyphen is illegal inside an XML comment and makes the file unparseable.)
       Regenerate with:  npm run og  -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.40" r="0.62">
      <stop offset="0" stop-color="#8A5A22" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#5A3A14" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2E1D0C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#2E1D0C"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the slip: the fortune, then the brand's surface under it -->
  <g transform="translate(600 0)">
    <rect x="-280" y="92" width="560" height="124" rx="6" fill="#F4EEE2"/>
    <text x="0" y="146" text-anchor="middle" font-size="31" fill="#3D2814">Your fortune holds within you.</text>
    <text x="0" y="188" text-anchor="middle" font-size="23" fill="#7A6A52">3, 9, 14, 22, 31, 45</text>

    <rect x="-280" y="226" width="560" height="74" rx="6" fill="#F7971E"/>
    <text x="-250" y="271" font-size="23" fill="#14110D">10% offer for you</text>
    <text x="250" y="271" text-anchor="end" font-size="23" font-weight="700" fill="#14110D">sweetslips</text>
  </g>

  <text x="600" y="412" text-anchor="middle" font-size="62" font-weight="700" fill="#F0E3CC" letter-spacing="-1">sweetslips</text>
  <text x="600" y="468" text-anchor="middle" font-size="27" fill="#C8B79B">Your brand on the slip that reaches the table,</text>
  <text x="600" y="506" text-anchor="middle" font-size="27" fill="#C8B79B">at restaurants everywhere.</text>

  <text x="600" y="570" text-anchor="middle" font-size="16" fill="#8E7B5F" letter-spacing="3.4">SWEETSLIPS.CO</text>
</svg>
