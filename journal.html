<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal | Wishbone</title>
<meta name="description" content="Notes from a brand that has not launched yet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'><path d='M3.4 4.2C6.6 4.6 8.6 7.6 9.8 11.6 10.6 14.2 11.4 16.4 12 18.6 12.6 16.4 13.4 14.2 14.2 11.6 15.4 7.6 17.4 4.6 20.6 4.2' stroke='%23E8663A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='3.2' cy='4.1' r='1.9' fill='%23E8663A'/><circle cx='20.8' cy='4.1' r='1.9' fill='%23E8663A'/></svg>">
</head>
<body data-page="journal">
<div class="underlay"></div><div class="grain"></div>
<div id="site-header"></div>
<main id="content">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow reveal">Journal</p>
      <h1 class="h2 reveal" style="margin-top:20px">Notes from before the launch.</h1>
      <p class="reveal">Written while it is still uncertain, which is the only time these are worth anything.</p>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container"><ul class="posts" id="posts"></ul></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { posts, icons } = window.WB;
  document.getElementById('posts').innerHTML = posts.map(p => `
    <li>
      <a class="format" href="contact.html">
        <span class="format__bg"></span>
        <div><div class="meta">${p.tag}</div><h3>${p.title}</h3></div>
        <div><p>${p.dek}</p><span class="know">Read more ${icons.smallArrow}</span></div>
      </a>
    </li>`).join('');
})();
</script>
</body>
</html>
